[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsrct-mcp"
version = "0.1.0"
description = "MCP server for the tsrct cryptographic content verification protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "tsrct", "cryptography", "a2a", "tdoc", "pki"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastmcp>=2.0",
  "pydantic>=2.0",
  "cryptography>=42.0",
  "qrcode>=7.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://tsrct.io"
Documentation = "https://docs.tsrct.io"
Repository = "https://github.com/tsrct/tsrct-mcp"

[project.scripts]
tsrct-mcp = "tsrct_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["tsrct_mcp"]
